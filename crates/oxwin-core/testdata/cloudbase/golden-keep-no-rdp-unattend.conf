# Generated by the Oxide Windows image builder. The one-shot run in
# the specialize pass of a clone's first boot.
[DEFAULT]
allow_reboot=false
stop_service_on_exit=false
check_latest_version=false
netbios_host_name_compatibility=false
ntp_enable_service=true
real_time_clock_utc=true
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
log_dir=C:\oxide\log
log_file=cloudbase-init-unattend.log
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService
plugins=cloudbaseinit.plugins.windows.ntpclient.NTPClientPlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin
[config_drive]
types=vfat
locations=hdd
raw_hdd=false
cdrom=false
