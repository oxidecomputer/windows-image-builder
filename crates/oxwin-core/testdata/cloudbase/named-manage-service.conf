# Generated by the Oxide Windows image builder. The cloudbase-init
# service, which runs on every boot.
[DEFAULT]
username=oxide
groups=Administrators
inject_user_password=false
allow_reboot=false
stop_service_on_exit=false
check_latest_version=false
netbios_host_name_compatibility=false
real_time_clock_utc=true
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
rdp_set_keepalive=true
verbose=true
debug=true
log_dir=C:\oxide\log
log_file=cloudbase-init.log
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService
plugins=cloudbaseinit.plugins.windows.createuser.CreateUserPlugin,cloudbaseinit.plugins.common.sshpublickeys.SetUserSSHPublicKeysPlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin
user_data_plugins=cloudbaseinit.plugins.common.userdataplugins.cloudconfig.CloudConfigPlugin,cloudbaseinit.plugins.common.userdataplugins.shellscript.ShellScriptPlugin
[config_drive]
types=vfat
locations=hdd
raw_hdd=false
cdrom=false
