[package]
name = "oxwin-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "oxwin_gui"
path = "src/lib.rs"

# Development only: the shipped binary is `oxwin`, in crates/oxwin, which carries
# both front ends.
[[bin]]
name = "oxwin-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
oxwin-core.workspace = true
anyhow.workspace = true
eframe = "0.36.1"
egui = "0.36.1"
rfd = "0.17.2"
oxwin-rack = { version = "0.1.0", path = "../oxwin-rack" }

# examples/icon-png.rs only, for the macOS bundle's .icns. Already in eframe's own
# tree at this version, so it adds nothing to a release build.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
