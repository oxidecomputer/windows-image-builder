[workspace]
resolver = "2"
members = ["crates/oxwin-core", "crates/oxwin-gui", "crates/oxwin-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
oxwin-core = { path = "crates/oxwin-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mirrors omicron: clippy's style nits are noise in CI, but anything in the
# disallowed_ namespace is a real signal and stays a warning.
[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
disallowed_macros = "warn"
disallowed_methods = "warn"
disallowed_names = "warn"
disallowed_types = "warn"
len_zero = "warn"
redundant_field_names = "warn"

[profile.release]
# A single distributable binary is the point: airgapped users get one file.
lto = "thin"
strip = true
