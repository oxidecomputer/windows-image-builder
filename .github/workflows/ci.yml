# Gate on pull requests and on what lands.
#
# Builds on all three platforms rather than one, because the app ships on all three and
# the goldens have to hold on each: a path separator or an endianness slip in a generated
# volume shows up nowhere else. There is no `cfg(target_os)` left in the tree — the one
# platform-conditional module, `mount.rs`, went with the JavaScript engine that needed it.
#
# The tests need no ISO and no payload download. That is deliberate — see the note in
# DEVELOPMENT.md — but it does mean a green run here has never built an image. The
# real-ISO build is a manual gate.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  style:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show && cargo --version && cargo clippy --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ubuntu-24.04-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-ubuntu-24.04-
      - run: sudo apt-get update && sudo apt-get install -y ${{ env.LINUX_DEPS }}
        env:
          LINUX_DEPS: >-
            libgtk-3-dev libxkbcommon-dev libwayland-dev
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      # The style group is allowed on purpose, matching omicron; the disallowed_* lints
      # are the ones that carry signal. See rustfmt.toml and the workspace lint table.
      - run: cargo clippy --all-targets -- --deny warnings --allow clippy::style

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # No payload here: build.rs embeds an empty table and the suite still runs, which
      # is also what a contributor's first `cargo test` does. The `embed` job below
      # covers the other path.
      - run: cargo build --all-targets --locked
      - run: cargo test --locked

  # The one mechanism in this workspace that cannot be exercised anywhere else.
  # `oxwin.exe` is linked as a GUI-subsystem binary so a double-click does not flash
  # a console window, which means it starts with no standard handles and has to
  # attach to its parent's console before it can print. If that breaks, every CLI
  # invocation on Windows succeeds silently — exit code 0, no output — and the
  # release workflow is the only other place that would notice, on a tag, too late.
  #
  # Release build on purpose: the subsystem attribute is `cfg(not(debug_assertions))`,
  # so a debug binary is console-subsystem and proves nothing.
  windows-cli:
    name: the CLI prints on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-winrel-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-winrel-
      - run: cargo build --release --locked -p oxwin
      # `--help` rather than `doctor`: it needs no payload and exits 0. Captured
      # through a pipe, which is also the case AttachConsole must not clobber.
      - name: usage reaches the caller
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/oxwin.exe --help > usage.txt
          cat usage.txt
          grep -q "usage: oxwin" usage.txt
      - name: a mistyped command still exits 2
        shell: bash
        run: |
          set +e
          ./target/release/oxwin.exe buidl > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" -eq 2
          grep -q "unknown command" out.txt

  embed:
    name: embed the payload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # Keyed on fetch-payload.sh, which holds every pinned version and checksum, so the
      # 790 MB virtio download happens once per payload change rather than once per run.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: payload-${{ hashFiles('tools/fetch-payload.sh') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-embed-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-embed-
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: ./tools/fetch-payload.sh
      # OXWIN_REQUIRE_PAYLOAD turns "no payload" from a warning into a build failure, so
      # this job cannot pass by quietly embedding nothing.
      - run: cargo build --locked -p oxwin-cli
        env:
          OXWIN_REQUIRE_PAYLOAD: "1"
      - name: doctor
        run: cargo run --locked -p oxwin-cli -- doctor
        env:
          OXWIN_REQUIRE_PAYLOAD: "1"
      # The embedded table is checked against its own manifest here, not just the
      # directory build.rs read.
      - run: cargo test --locked -p oxwin-core --lib -- assets
        env:
          OXWIN_REQUIRE_PAYLOAD: "1"
