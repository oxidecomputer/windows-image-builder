# Build and publish binaries for a version tag.
#
# The payload is fetched once, on Linux, and published as an artifact that every platform
# build then embeds. Two reasons: `fetch-payload.sh` is bash and needs bsdtar, which is
# awkward on a Windows runner; and fetching once means all three artifacts embed the same
# bytes by construction rather than by three independent downloads agreeing. The
# fingerprint check at the end proves it.
#
# Every push and pull request runs the whole build, so each run ends with downloadable
# archives someone can test from the run's Artifacts section. Only a version tag
# publishes a release, so the version in the tag is still a deliberate act.

name: Release

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  # So the whole path can be exercised without minting a version.
  workflow_dispatch:

# A newer push to the same branch or PR makes the older build moot. Tags each get
# their own group, so a release is never canceled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only `publish` writes, and it only runs on a tag.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Never ship a binary that quietly embedded nothing.
  OXWIN_REQUIRE_PAYLOAD: "1"

jobs:
  payload:
    name: fetch the payload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keyed on fetch-payload.sh, which holds every pinned version and SHA-256.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: payload-${{ hashFiles('tools/fetch-payload.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: ./tools/fetch-payload.sh
      - name: Summarize what was fetched
        run: |
          echo "payload files: $(find assets -type f | wc -l)"
          du -sh assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload
          path: assets/
          retention-days: 1
          # The payload is binary and already compressed; recompressing costs minutes.
          compression-level: 0

  build:
    name: ${{ matrix.name }}
    needs: payload
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-15
            # Two slices, lipo'd. Intel Macs are 2019 and earlier, so when dropping
            # them is acceptable, delete the x86_64 target from this line and the
            # `lipo` step below collapses to a copy.
            targets: aarch64-apple-darwin x86_64-apple-darwin
            archive: tar.gz
          - name: linux-x86_64
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: windows-x86_64
            os: windows-2025
            targets: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - name: Add targets
        shell: bash
        run: for t in ${{ matrix.targets }}; do rustup target add "$t"; done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payload
          path: assets/
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # One binary, both front ends: clicked it is the app, given arguments it is
      # the CLI. `oxwin-gui` and `oxwin-cli` are libraries it links, and their own
      # bin targets are for development only, so nothing here builds them.
      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$t" -p oxwin
          done

      # A universal binary is two complete Mach-O slices, so the embedded payload appears
      # in both. That is inherent: lipo concatenates whole objects and cannot share data
      # between them.
      - name: Combine or collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          read -ra targets <<< "${{ matrix.targets }}"
          if [ "${#targets[@]}" -gt 1 ]; then
            paths=()
            for t in "${targets[@]}"; do
              paths+=("target/$t/release/oxwin")
            done
            lipo -create -output dist/oxwin "${paths[@]}"
            lipo -info dist/oxwin
          else
            cp "target/${targets[0]}/release/oxwin${ext}" "dist/oxwin${ext}"
          fi
          cp README.md LICENSE dist/
          ls -lh dist

      # Runs the binary that was just built, so "it embedded a real payload" is checked
      # on the artifact rather than inferred from the build succeeding. Every artifact
      # here is native to its runner.
      - name: Verify the artifact
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          "./dist/oxwin${ext}" doctor | tee doctor.txt
          # doctor exits non-zero on failure, so reaching here means the payload is
          # present; pull the fingerprint out for the cross-platform comparison.
          grep -o 'fingerprint [0-9a-f]*' doctor.txt | awk '{print $2}' \
            > "fingerprint-${{ matrix.name }}.txt"
          cat "fingerprint-${{ matrix.name }}.txt"

      # Running it above proves nothing about the C runtime: the runner has the
      # VC++ DLLs and a vanilla Windows install does not. See `ci.yml`.
      - name: The C runtime is linked statically
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          readobj="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-readobj.exe"
          "$readobj" --coff-imports dist/oxwin.exe \
            | grep 'Name:' | sort -u | tee imports.txt
          if grep -Eiq 'vcruntime|msvcp|ucrtbase|api-ms-win-crt' imports.txt; then
            echo "oxwin.exe imports the C runtime from a DLL" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-${{ matrix.name }}
          path: fingerprint-${{ matrix.name }}.txt

      # The wrappers each desktop needs before a double-click does anything. The
      # binary inside the bundle is the one just verified; the loose copy stays in
      # the archive for CLI use.
      #
      # Signing is a no-op until MACOS_SIGN_IDENTITY is set as a repository secret
      # (a Developer ID certificate imported into the runner keychain first, which
      # is a step to add alongside it). Adding NOTARY_KEYCHAIN_PROFILE notarizes
      # and staples as well. Unsigned, Gatekeeper refuses the bundle until its
      # quarantine attribute is cleared, which the release notes below explain.
      - name: Wrap it for macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEYCHAIN_PROFILE: ${{ secrets.NOTARY_KEYCHAIN_PROFILE }}
        run: ./tools/package-macos.sh --binary dist/oxwin --out dist

      - name: Wrap it for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cp tools/oxide-windows.desktop dist/

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="oxide-windows-image-builder-${{ matrix.name }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "../${name}.zip" .)
          else
            tar -czf "${name}.tar.gz" -C dist .
          fi
          ls -lh "${name}."*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: oxide-windows-image-builder-${{ matrix.name }}.*

  fingerprints:
    name: the artifacts carry the same payload
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fingerprint-*
          merge-multiple: true
      - name: Compare
        run: |
          set -euo pipefail
          cat fingerprint-*.txt
          count=$(sort -u fingerprint-*.txt | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "the platform artifacts embedded different payloads" >&2
            exit 1
          fi
          echo "all artifacts embed payload $(sort -u fingerprint-*.txt)"

  publish:
    name: publish the release
    needs: [build, fingerprints]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-x86_64"
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-universal
      - run: ls -lh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Via the environment rather than interpolated into the command, so a tag name
          # cannot become part of the shell.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          One binary, `oxwin`. Double-click it and it is the desktop app; run it with
          arguments and it is the CLI. `oxwin doctor` reports what it found; `oxwin
          --help` lists the commands.

          - **macOS** — open `Windows Image Builder.app`. The loose `oxwin` beside it
            is the same binary, for command-line use.
          - **Windows** — double-click `oxwin.exe`, or run it from a shell. Note that
            a GUI-subsystem binary does not hold the shell prompt: for a script that
            depends on ordering, use `start /wait oxwin.exe …`.
          - **Linux** — run `oxwin`, or install `oxide-windows.desktop` (it names the
            binary on your PATH) for a launcher entry.

          Unsigned builds. On macOS, Gatekeeper will refuse anything downloaded until
          its quarantine attribute is cleared:

              xattr -dr com.apple.quarantine "Windows Image Builder.app" oxwin

          The virtio drivers, OpenSSH and EFI binaries the media carries are compiled in,
          so nothing else needs downloading. Run `oxwin doctor` to confirm.
          EOF
          )
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "$notes" \
            --verify-tag \
            oxide-windows-image-builder-*.tar.gz \
            oxide-windows-image-builder-*.zip
