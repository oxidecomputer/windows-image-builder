# Dependency updates.
#
# Grouped aggressively on purpose. egui is a deep tree — eframe, egui, egui_glow,
# egui-winit, epaint and their transitive winit/wgpu stack all move together — and
# ungrouped that arrives as dozens of PRs that individually do not compile, because a
# bump to one of them without the others is not a valid state.
#
# egui also makes breaking API changes at every minor release: this project is written
# against 0.36's reworked `App::ui`/`Panel` API, which is unrecognisable next to 0.35.
# So a minor-version egui PR is a porting task, not a merge button, and it is left
# ungrouped from the patch stream to make that obvious in the PR title.
#
# The goldens are what makes any of this safe to accept. A dependency that changes a
# generated byte fails CI on all three platforms rather than shipping an image whose
# defect only appears on a rack.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Everything that is a routine bump: one PR, merge if CI is green.
      patches:
        applies-to: version-updates
        update-types: [patch]
      # Minor bumps kept together so an interdependent tree arrives as one reviewable
      # change rather than as pieces that do not build in isolation.
      minor:
        applies-to: version-updates
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
